[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oo-os"
version = "0.1.0"
description = "OO-OS — an object-oriented operating system: every resource is an object, every reference is a capability"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ooos = "ooos.boot:main"

[tool.setuptools.packages.find]
include = ["ooos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
